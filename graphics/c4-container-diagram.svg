<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #475569; }
      .boundary-label { font-size: 14px; font-weight: 700; fill: #334155; }
      .box-title { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .box-tech { font-size: 12px; fill: #e2e8f0; }
      .box-desc { font-size: 12px; fill: #f8fafc; }
      .mod-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .mod-desc { font-size: 11px; fill: #334155; }
      .ext-title { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .ext-tech { font-size: 12px; fill: #e2e8f0; }
      .rel-label { font-size: 12px; font-weight: 600; fill: #1e293b; }
      .rel-tech { font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="840" fill="#ffffff" />

  <!-- Header -->
  <text x="30" y="40" class="title">C4 Model — Level 2: Container Diagram</text>
  <text x="30" y="62" class="subtitle">Vacancies Analysis System (React + Vite Frontend, NestJS Modular Monolith Backend, PostgreSQL)</text>

  <!-- System Boundary -->
  <rect x="320" y="95" width="760" height="710" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" />
  <text x="340" y="122" class="boundary-label">Vacancies Analysis System [Software System]</text>

  <!-- Person: User -->
  <circle cx="125" cy="175" r="24" fill="#08427b" />
  <rect x="30" y="200" width="190" height="90" rx="10" fill="#08427b" />
  <text x="125" y="226" text-anchor="middle" class="box-title">User</text>
  <text x="125" y="244" text-anchor="middle" class="box-tech">[Person]</text>
  <text x="125" y="266" text-anchor="middle" class="box-desc">Browses vacancies &amp; analytics</text>

  <!-- Container: Frontend -->
  <rect x="360" y="145" width="300" height="140" rx="10" fill="#438dd5" stroke="#2e6295" stroke-width="2" />
  <text x="510" y="176" text-anchor="middle" class="box-title">Frontend</text>
  <text x="510" y="196" text-anchor="middle" class="box-tech">[Container: React, Vite, TypeScript]</text>
  <text x="510" y="226" text-anchor="middle" class="box-desc">Single-Page Application served in browser;</text>
  <text x="510" y="244" text-anchor="middle" class="box-desc">displays listings and analytics dashboards.</text>

  <!-- Container: Backend -->
  <rect x="360" y="365" width="400" height="415" rx="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" />
  <text x="560" y="394" text-anchor="middle" class="box-title">Backend (Modular Monolith)</text>
  <text x="560" y="414" text-anchor="middle" class="box-tech">[Container: Node.js, NestJS, TypeScript]</text>

  <!-- Backend Internal Modules -->
  <!-- Domain Modules -->
  <rect x="380" y="435" width="170" height="82" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5" />
  <text x="465" y="460" text-anchor="middle" class="mod-title">market</text>
  <text x="465" y="479" text-anchor="middle" class="mod-desc">Domain Module</text>
  <text x="465" y="496" text-anchor="middle" class="mod-desc">Vacancy listings &amp; search</text>

  <rect x="570" y="435" width="170" height="82" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5" />
  <text x="655" y="460" text-anchor="middle" class="mod-title">analytics</text>
  <text x="655" y="479" text-anchor="middle" class="mod-desc">Domain Module</text>
  <text x="655" y="496" text-anchor="middle" class="mod-desc">Trends &amp; market metrics</text>

  <rect x="380" y="535" width="170" height="82" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5" />
  <text x="465" y="560" text-anchor="middle" class="mod-title">ingestion</text>
  <text x="465" y="579" text-anchor="middle" class="mod-desc">Domain Module</text>
  <text x="465" y="596" text-anchor="middle" class="mod-desc">Feed fetch &amp; normalization</text>

  <!-- Technical Components -->
  <rect x="570" y="535" width="170" height="82" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <text x="655" y="560" text-anchor="middle" class="mod-title">scheduled-jobs</text>
  <text x="655" y="579" text-anchor="middle" class="mod-desc">Technical Component</text>
  <text x="655" y="596" text-anchor="middle" class="mod-desc">Periodic sync triggers</text>

  <rect x="380" y="640" width="360" height="90" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <text x="560" y="668" text-anchor="middle" class="mod-title">prisma</text>
  <text x="560" y="688" text-anchor="middle" class="mod-desc">Technical Component (ORM &amp; Schema Management)</text>
  <text x="560" y="706" text-anchor="middle" class="mod-desc">Shared PostgreSQL connection &amp; query access</text>

  <!-- Container: Database (Cylinder) -->
  <path d="M 880 658 L 880 760 A 85 16 0 0 0 1050 760 L 1050 658 Z" fill="#1168bd" stroke="#0b4884" stroke-width="2" />
  <ellipse cx="965" cy="658" rx="85" ry="16" fill="#2e83d4" stroke="#0b4884" stroke-width="2" />
  <text x="965" y="702" text-anchor="middle" class="box-title">Database</text>
  <text x="965" y="722" text-anchor="middle" class="box-tech">[Container: PostgreSQL]</text>
  <text x="965" y="744" text-anchor="middle" class="box-desc">Stores vacancy data</text>

  <!-- External System: Djinni RSS Feed -->
  <rect x="1130" y="385" width="240" height="115" rx="10" fill="#64748b" stroke="#475569" stroke-width="2" />
  <text x="1250" y="420" text-anchor="middle" class="ext-title">Djinni RSS Feed</text>
  <text x="1250" y="440" text-anchor="middle" class="ext-tech">[External System]</text>
  <text x="1250" y="468" text-anchor="middle" class="box-desc">djinni.co/jobs/rss/</text>

  <!-- External System: Jobico XML Feed -->
  <rect x="1130" y="540" width="240" height="115" rx="10" fill="#64748b" stroke="#475569" stroke-width="2" />
  <text x="1250" y="575" text-anchor="middle" class="ext-title">Jobico XML Feed</text>
  <text x="1250" y="595" text-anchor="middle" class="ext-tech">[External System]</text>
  <text x="1250" y="623" text-anchor="middle" class="box-desc">jobico.io/api/feeds/jobs.xml</text>

  <!-- Relationships -->
  <!-- Person -> Frontend -->
  <line x1="220" y1="230" x2="354" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="287" y="206" text-anchor="middle" class="rel-label">Uses UI</text>
  <text x="287" y="221" text-anchor="middle" class="rel-tech">[HTTPS]</text>

  <!-- Frontend -> Backend -->
  <line x1="510" y1="285" x2="510" y2="359" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="524" y="320" class="rel-label">Makes API calls</text>
  <text x="524" y="336" class="rel-tech">[HTTP / JSON]</text>

  <!-- Backend -> Database -->
  <line x1="760" y1="708" x2="874" y2="708" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="817" y="684" text-anchor="middle" class="rel-label">Reads/writes</text>
  <text x="817" y="699" text-anchor="middle" class="rel-tech">[Prisma / SQL]</text>

  <!-- Backend -> Djinni RSS Feed -->
  <line x1="760" y1="442" x2="1124" y2="442" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="945" y="420" text-anchor="middle" class="rel-label">Fetches job feed</text>
  <text x="945" y="435" text-anchor="middle" class="rel-tech">[HTTPS / RSS XML]</text>

  <!-- Backend -> Jobico XML Feed -->
  <line x1="760" y1="585" x2="1124" y2="585" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="945" y="563" text-anchor="middle" class="rel-label">Fetches job feed</text>
  <text x="945" y="578" text-anchor="middle" class="rel-tech">[HTTPS / XML]</text>
</svg>
